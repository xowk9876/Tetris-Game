<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris responsive QA</title>
<style>body{margin:0;background:#151925;color:white;font:14px system-ui}header{padding:8px;position:sticky;top:0;background:#151925;z-index:1}button{padding:8px;margin:3px}iframe{display:block;margin:0 auto;border:1px solid #64748b;background:#000}output{margin-left:12px}</style>
<header>화면 검증 <button data-size="1280,840">데스크톱</button><button data-size="393,780">휴대폰 393</button><button data-size="320,700">휴대폰 320</button><button data-size="768,900">태블릿 768</button><button data-size="568,320">가로 568</button><output>1280 × 840</output></header>
<iframe src="/" title="테트리스 검증 화면" width="1280" height="840" allow="autoplay"></iframe>
<script>const frame=document.querySelector('iframe');for(const button of document.querySelectorAll('button'))button.onclick=()=>{const [w,h]=button.dataset.size.split(',');frame.width=w;frame.height=h;document.querySelector('output').textContent=w+' × '+h;};</script>
</html>
