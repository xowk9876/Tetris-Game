<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris responsive QA</title>
<style>body{margin:0;background:#151925;color:white;font:14px system-ui}header{padding:8px;position:sticky;top:0;background:#151925;z-index:1}button{padding:8px;margin:3px}iframe{display:block;margin:0 auto;border:1px solid #64748b;background:#000}output{margin-left:12px}</style>
<header>화면 검증 <button data-size="1280,840">데스크톱</button><button data-size="393,780">휴대폰 393</button><button data-size="320,700">휴대폰 320</button><button data-size="768,900">태블릿 768</button><button data-size="568,320">가로 568</button><button id="saved">저장 복원 테스트</button><button id="invalid">손상 저장 테스트</button><button id="four">4줄 제거 준비</button><button id="hold">막힌 홀드 준비</button><button id="restart">줄 제거 중 재시작</button><output>1280 × 840</output></header>
<iframe src="/" title="테트리스 검증 화면" width="1280" height="840" allow="autoplay"></iframe>
<script>const frame=document.querySelector('iframe');for(const button of document.querySelectorAll('button[data-size]'))button.onclick=()=>{const [w,h]=button.dataset.size.split(',');frame.width=w;frame.height=h;document.querySelector('output').textContent=w+' × '+h;};document.querySelector('#saved').onclick=()=>{localStorage.setItem('tetrisBestScore','1200');localStorage.setItem('tetrisAudioEnabled','false');frame.src='/';};document.querySelector('#invalid').onclick=()=>{localStorage.setItem('tetrisBestScore','NaN');frame.src='/';};
function fixture(setup) {
 const game=frame.contentWindow.__tetrisQA;
 const ready=state=>{if(!state.ready)return;game.events.off('tetris-state',ready);setup(game.scene.getScene('TetrisScene'));};
 game.events.on('tetris-state',ready);game.scene.getScene('TetrisScene').newGame();
}
function four(scene){const state=scene.gameState;const Piece=state.currentBlock.constructor;state.currentBlock=new Piece('I');state.currentBlock.rotation=1;state.currentBlock.x=2;state.currentBlock.y=16;for(let y=16;y<20;y++){state.board.grid[y].fill(1);state.board.grid[y][4]=0;}scene.renderer.markBoardDirty();scene.renderer.update();}
document.querySelector('#four').onclick=()=>fixture(four);
document.querySelector('#hold').onclick=()=>fixture(scene=>{const state=scene.gameState,Piece=state.currentBlock.constructor;state.currentBlock=new Piece('T');state.currentBlock.y=10;state.holdBlock=new Piece('O');state.board.grid[0][4]=1;scene.renderer.markBoardDirty();scene.renderer.update();});
document.querySelector('#restart').onclick=()=>fixture(scene=>{four(scene);scene.executeAction('hardDrop');scene.newGame();});
</script>
</html>
